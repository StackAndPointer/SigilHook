name: GCC x86/x64

on:
  workflow_dispatch:

jobs:
  build:
    name: GCC ${{ matrix.bitness }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - bitness: x86
            cmake_flags: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
          - bitness: x64
            cmake_flags: -DCMAKE_C_FLAGS=-m64 -DCMAKE_CXX_FLAGS=-m64

    env:
      BUILD_DIR: ${{ github.workspace }}/build-gcc-${{ matrix.bitness }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install 32-bit GCC support
        if: ${{ matrix.bitness == 'x86' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Generate AsmJit x86 sources
        working-directory: asmjit/tools
        run: node tablegen-x86.js

      - name: Configure CMake
        run: >
          cmake -S . -B "${{ env.BUILD_DIR }}"
          -DSIGILHOOK_BUILD_DLL=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel
